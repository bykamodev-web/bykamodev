name = "bykamodev"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[[send_email]]
name = "EMAIL"
destination_address = "hello@bykamo.dev"

# Contact chat cost guards. Windows are 10s or 60s only, counted per Cloudflare location,
# and a namespace_id is shared by every Worker on the account that uses the same number.
[[ratelimits]]
name = "RL_CHAT_SESSION" # key: chat session id
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "RL_CHAT_IP" # key: client IP
namespace_id = "1002"

  [ratelimits.simple]
  limit = 15
  period = 60

[[ratelimits]]
name = "RL_SUBMIT_IP" # key: "start:<ip>" / "submit:<ip>"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 5
  period = 60

# Daily ceilings on AI calls, per client and site-wide (src/lib/contact/daily-cap.ts).
[[kv_namespaces]]
binding = "CONTACT_KV"
id = "d282832740f14719ab14d128ac1f1181"
